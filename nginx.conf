server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config: fall back to the bundled example when no config.js is mounted.
    location = /config.js {
        try_files /config.js /config.example.js;
        add_header Cache-Control "no-cache";
    }

    # Runtime custom styles: mount your own file at /usr/share/nginx/html/styles/custom.css.
    location = /styles/custom.css {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}